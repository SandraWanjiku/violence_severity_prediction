<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Women's Violence Severity Prediction</title>

</head>


<body>

    <h1>Women's Violence Severity Prediction</h1>

    <p>
        Enter the information below to predict the severity category.
    </p>


    <form action="/predict" method="POST">


        <!-- Year -->

        <label for="year">Year:</label>

        <input
            type="number"
            id="year"
            name="year"
            min="1900"
            max="2100"
            required
        >

        <br><br>


        <!-- Violence Type -->

        <label for="violence_type">Violence Type:</label>

        <select
            id="violence_type"
            name="violence_type"
            required
        >

            <option value="">Select violence type</option>

            <option value="Rape">Rape</option>

            <option value="Domestic Worker Abuse">
                Domestic Worker Abuse
            </option>

            <option value="Dowry">
                Dowry
            </option>

            <option value="Acid Attack">
                Acid Attack
            </option>

            <option value="Burnt">
                Burnt
            </option>

            <option value="Sexual Harasment">
                Sexual Harasment
            </option>

            <option value="Early Marriage">
                Early Marriage
            </option>

            <option value="Women Trafficking">
                Women Trafficking
            </option>

            <option value="Rejection Based Violence">
                Rejection Based Violence
            </option>

            <option value="Societal Coercion">
                Societal Coercion
            </option>

            <option value="Police Brutality">
                Police Brutality
            </option>

            <option value="Lethal Violence">
                Lethal Violence
            </option>

            <option value="Misuse Of Religious Edicts">
                Misuse Of Religious Edicts
            </option>

        </select>

        <br><br>


        <!-- Victim Age -->

        <label for="victim_age">Victim Age:</label>

        <select
            id="victim_age"
            name="victim_age"
            required
        >

            <option value="">Select age group</option>

            <option value="0-18">0-18</option>

            <option value="19-24">19-24</option>

            <option value="25-30">25-30</option>

            <option value="31+">31+</option>

        </select>

        <br><br>


        <!-- Literacy -->

        <label for="literate_scale">Literate Scale:</label>

        <select
            id="literate_scale"
            name="literate_scale"
            required
        >

            <option value="">Select literacy level</option>

            <option value="Low">Low</option>

            <option value="Medium">Medium</option>

            <option value="High">High</option>

        </select>

        <br><br>


        <!-- Death Count -->

        <label for="death_count">Death Count:</label>

        <input
            type="number"
            id="death_count"
            name="death_count"
            min="0"
            required
        >

        <br><br>


        <!-- Incident Count -->

        <label for="incident_count">Incident Count:</label>

        <input
            type="number"
            id="incident_count"
            name="incident_count"
            min="0"
            required
        >

        <br><br>


        <button type="submit">
            Predict Severity
        </button>


    </form>


    {% if prediction %}

        <h2>Predicted Severity:</h2>

        <h3>{{ prediction }}</h3>

    {% endif %}


</body>

</html>
